networks:
  forecast-net:
    driver: bridge

volumes:
  product-db-data:
  order-db-data:
  forecast-db-data:
  notification-db-data:
  kafka-data:
  zookeeper-data:
  redis-data:
  prometheus-data:
  grafana-data:
  db-backups:

services:

  # ─────────────────────────────────────────────
  # Infrastructure
  # ─────────────────────────────────────────────

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
    networks:
      - forecast-net
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - forecast-net
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infrastructure/kafka/create-topics.sh:/create-topics.sh
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    networks:
      - forecast-net

  # ─────────────────────────────────────────────
  # Kafka UI — visual dashboard at http://localhost:8090
  # ─────────────────────────────────────────────

  # ─────────────────────────────────────────────
  # Schema Registry — Kafka mesaj şemalarını versiyonlar
  # Servisler mesaj göndermeden önce şemayı doğrular
  # UI: http://localhost:8081 (Confluent Control Center değil, schema-registry-ui)
  # ─────────────────────────────────────────────
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    container_name: schema-registry
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8091:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    networks:
      - forecast-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/subjects"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
    networks:
      - forecast-net
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ─────────────────────────────────────────────
  # Redis — used by API Gateway rate limiter
  # ─────────────────────────────────────────────

  redis:
    image: redis:7.2-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - forecast-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ─────────────────────────────────────────────
  # Databases (one per service)
  # ─────────────────────────────────────────────

  product-db:
    image: postgres:16-alpine
    container_name: product-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: productdb
      POSTGRES_USER: ${PRODUCT_DB_USER:-product_user}
      POSTGRES_PASSWORD: ${PRODUCT_DB_PASSWORD:-product_pass}
    ports:
      - "5435:5432"
    volumes:
      - product-db-data:/var/lib/postgresql/data
    networks:
      - forecast-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PRODUCT_DB_USER:-product_user} -d productdb"]
      interval: 10s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  order-db:
    image: postgres:16-alpine
    container_name: order-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: ${ORDER_DB_USER:-order_user}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:-order_pass}
    ports:
      - "5433:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data
    networks:
      - forecast-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ORDER_DB_USER:-order_user} -d orderdb"]
      interval: 10s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  forecast-db:
    image: postgres:16-alpine
    container_name: forecast-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: forecastdb
      POSTGRES_USER: ${FORECAST_DB_USER:-forecast_user}
      POSTGRES_PASSWORD: ${FORECAST_DB_PASSWORD:-forecast_pass}
    ports:
      - "5434:5432"
    volumes:
      - forecast-db-data:/var/lib/postgresql/data
    networks:
      - forecast-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FORECAST_DB_USER:-forecast_user} -d forecastdb"]
      interval: 10s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  notification-db:
    image: postgres:16-alpine
    container_name: notification-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: notificationdb
      POSTGRES_USER: ${NOTIFICATION_DB_USER:-notification_user}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-notification_pass}
    ports:
      - "5436:5432"
    volumes:
      - notification-db-data:/var/lib/postgresql/data
    networks:
      - forecast-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NOTIFICATION_DB_USER:-notification_user} -d notificationdb"]
      interval: 10s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ─────────────────────────────────────────────
  # Application Services
  # ─────────────────────────────────────────────

  api-gateway:
    build: ./services/api-gateway
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PRODUCT_SERVICE_URL: http://product-service:8081
      ORDER_SERVICE_URL: http://order-service:8082
      FORECAST_SERVICE_URL: http://forecast-service:8083
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-must-be-32-chars}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
      product-service:
        condition: service_started
      order-service:
        condition: service_started
      forecast-service:
        condition: service_started
    networks:
      - forecast-net
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  product-service:
    build: ./services/product-service
    container_name: product-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://product-db:5432/productdb
      SPRING_DATASOURCE_USERNAME: ${PRODUCT_DB_USER:-product_user}
      SPRING_DATASOURCE_PASSWORD: ${PRODUCT_DB_PASSWORD:-product_pass}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      product-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - forecast-net
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  order-service:
    build: ./services/order-service
    container_name: order-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://order-db:5432/orderdb
      SPRING_DATASOURCE_USERNAME: ${ORDER_DB_USER:-order_user}
      SPRING_DATASOURCE_PASSWORD: ${ORDER_DB_PASSWORD:-order_pass}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      order-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - forecast-net
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  forecast-service:
    build: ./services/forecast-service
    container_name: forecast-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://forecast-db:5432/forecastdb
      SPRING_DATASOURCE_USERNAME: ${FORECAST_DB_USER:-forecast_user}
      SPRING_DATASOURCE_PASSWORD: ${FORECAST_DB_PASSWORD:-forecast_pass}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ML_SERVICE_URL: http://ml-inference-service:8000
    depends_on:
      forecast-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      ml-inference-service:
        condition: service_healthy
    networks:
      - forecast-net
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  notification-service:
    build: ./services/notification-service
    container_name: notification-service
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://notification-db:5432/notificationdb
      SPRING_DATASOURCE_USERNAME: ${NOTIFICATION_DB_USER:-notification_user}
      SPRING_DATASOURCE_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-notification_pass}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      notification-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - forecast-net
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  ml-inference-service:
    build: ./services/ml-inference-service
    container_name: ml-inference-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - forecast-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  # ─────────────────────────────────────────────────────────
  # Monitoring Stack
  # ─────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - forecast-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER:     ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP:     "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - forecast-net
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
