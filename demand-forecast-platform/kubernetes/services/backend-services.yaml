# ══════════════ ML INFERENCE SERVICE (Python) ═════════════════════════════════
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-inference-service
  namespace: demand-forecast
  labels: { app: ml-inference-service, tier: ml }
spec:
  replicas: 2
  selector:
    matchLabels: { app: ml-inference-service }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: ml-inference-service, tier: ml }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: ml-inference-service
          image: docker.io/YOUR_DOCKERHUB/demand-forecast-ml-inference-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: ENVIRONMENT
              value: kubernetes
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://jaeger.demand-forecast-monitoring.svc.cluster.local:4317
            - name: OTEL_SERVICE_NAME
              value: ml-inference-service
          startupProbe:
            httpGet: { path: /health, port: 8000 }
            failureThreshold: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /health/ready, port: 8000 }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: { cpu: "500m", memory: "1Gi" }  # Prophet + pandas are memory-hungry
            limits: { cpu: "2", memory: "3Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: ml-inference-service
  namespace: demand-forecast
spec:
  selector: { app: ml-inference-service }
  ports:
    - { name: http, port: 8000, targetPort: 8000 }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ml-inference-hpa
  namespace: demand-forecast
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ml-inference-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }
    - type: Resource
      resource:
        name: memory
        target: { type: Utilization, averageUtilization: 75 }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600  # ML models are expensive to load
