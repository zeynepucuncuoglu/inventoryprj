# DO NOT commit real secrets to git.
# Apply with: kubectl apply -f secrets.yaml -n demand-forecast
# In production, use External Secrets Operator + HashiCorp Vault or AWS Secrets Manager.
#
# Generate base64 values: echo -n 'value' | base64
#
# Example only — all values are placeholders
apiVersion: v1
kind: Secret
metadata:
  name: demand-forecast-secrets
  namespace: demand-forecast
  labels:
    app.kubernetes.io/managed-by: external-secrets  # replace with ESO in prod
type: Opaque
data:
  # JWT signing key (min 32 chars, base64-encoded)
  jwt-secret: REPLACE_WITH_BASE64_JWT_SECRET

  # Database credentials
  product-db-user: REPLACE_WITH_BASE64_PRODUCT_DB_USER
  product-db-password: REPLACE_WITH_BASE64_PRODUCT_DB_PASSWORD

  order-db-user: REPLACE_WITH_BASE64_ORDER_DB_USER
  order-db-password: REPLACE_WITH_BASE64_ORDER_DB_PASSWORD

  forecast-db-user: REPLACE_WITH_BASE64_FORECAST_DB_USER
  forecast-db-password: REPLACE_WITH_BASE64_FORECAST_DB_PASSWORD

  notification-db-user: REPLACE_WITH_BASE64_NOTIFICATION_DB_USER
  notification-db-password: REPLACE_WITH_BASE64_NOTIFICATION_DB_PASSWORD

  # Grafana
  grafana-admin-user: REPLACE_WITH_BASE64
  grafana-admin-password: REPLACE_WITH_BASE64

  # Alertmanager webhooks
  slack-webhook-incidents: REPLACE_WITH_BASE64
  slack-webhook-platform: REPLACE_WITH_BASE64
  pagerduty-service-key: REPLACE_WITH_BASE64
