name: CI Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - 'demand-forecast-platform/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'demand-forecast-platform/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ─────────────────────────────────────────────────────────────
  # Java services — unit + Testcontainers integration tests
  # ─────────────────────────────────────────────────────────────
  test-java:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - product-service
          - order-service
          - forecast-service
          - notification-service

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Run Maven tests
        working-directory: demand-forecast-platform/services/${{ matrix.service }}
        run: mvn test -B --no-transfer-progress

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-${{ matrix.service }}
          path: demand-forecast-platform/services/${{ matrix.service }}/target/surefire-reports/
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────
  # Python ML inference service (FastAPI + pytest)
  # ─────────────────────────────────────────────────────────────
  test-python:
    name: Test ml-inference-service
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: demand-forecast-platform/services/ml-inference-service/requirements.txt

      - name: Install dependencies
        working-directory: demand-forecast-platform/services/ml-inference-service
        # prophet requires CmdStan which bloats CI; skip it since the
        # forecaster uses numpy/pandas only (see prophet_forecaster.py)
        run: |
          pip install \
            fastapi==0.136.3 \
            "uvicorn[standard]==0.48.0" \
            pydantic==2.11.5 \
            pandas==2.2.2 \
            numpy==1.26.4 \
            scikit-learn==1.4.2 \
            joblib==1.4.2 \
            httpx==0.28.1 \
            prometheus-fastapi-instrumentator==8.0.0 \
            pytest==8.2.0 \
            pytest-asyncio==1.4.0

      - name: Run pytest
        working-directory: demand-forecast-platform/services/ml-inference-service
        run: pytest tests/ -v --tb=short --junitxml=test-results.xml

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results
          path: demand-forecast-platform/services/ml-inference-service/test-results.xml
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────
  # Docker build — sadece image oluşturur, push yapmaz
  # Docker Hub hazır olunca push eklenebilir
  # ─────────────────────────────────────────────────────────────
  docker-build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [test-java, test-python]
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - product-service
          - order-service
          - forecast-service
          - notification-service
          - ml-inference-service

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: demand-forecast-platform/services/${{ matrix.service }}
          push: false
          tags: ${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  # ─────────────────────────────────────────────────────────────
  # Staging deploy — develop branch'te otomatik tetiklenir
  # Sunucu: STAGING_HOST, STAGING_USER, STAGING_SSH_KEY secret'ları
  # Secret tanımlı değilse adım atlanır, pipeline yine de geçer
  # ─────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy → Staging
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}

    steps:
      - uses: actions/checkout@v6

      - name: Deploy to staging server
        if: env.STAGING_HOST != ''
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/demand-forecast-platform
            git pull origin develop
            docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d --build --remove-orphans
            bash scripts/health-check.sh

      - name: No staging server configured
        if: env.STAGING_HOST == ''
        run: |
          echo "STAGING_HOST secret tanımlı değil — deploy atlandı."
          echo "Etkinleştirmek için: STAGING_HOST, STAGING_USER, STAGING_SSH_KEY secret'larını ekle."

  # ─────────────────────────────────────────────────────────────
  # Production deploy — main branch'te, manuel onay sonrası
  # Sunucu: PROD_HOST, PROD_USER, PROD_SSH_KEY secret'ları
  # GitHub'da 'production' environment'ında required reviewer ekle
  # ─────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy → Production
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main'
    environment: production
    env:
      PROD_HOST: ${{ secrets.PROD_HOST }}

    steps:
      - uses: actions/checkout@v6

      - name: Deploy to production server
        if: env.PROD_HOST != ''
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/demand-forecast-platform
            git pull origin main
            bash scripts/deployment.sh

      - name: No production server configured
        if: env.PROD_HOST == ''
        run: |
          echo "PROD_HOST secret tanımlı değil — deploy atlandı."
          echo "Etkinleştirmek için: PROD_HOST, PROD_USER, PROD_SSH_KEY secret'larını ekle."

  # ─────────────────────────────────────────────────────────────
  # Required status check — blocks PR merge if any job fails
  # ─────────────────────────────────────────────────────────────
  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    needs: [test-java, test-python, docker-build]
    if: always()
    steps:
      - name: All jobs must pass
        run: |
          if [[ "${{ needs.test-java.result }}"    != "success" ]] || \
             [[ "${{ needs.test-python.result }}"  != "success" ]] || \
             [[ "${{ needs.docker-build.result }}" != "success" ]]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed"
