# ─────────────────────────────────────────────────────────────────────────────
# Shared template for product, order, forecast, notification services.
# Each follows the same pattern: Deployment + Service + HPA + PDB.
# ─────────────────────────────────────────────────────────────────────────────

# ══════════════ PRODUCT SERVICE ══════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: demand-forecast
  labels: { app: product-service, tier: backend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: product-service }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: product-service, tier: backend }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8081"
    spec:
      terminationGracePeriodSeconds: 60
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector: { matchLabels: { app: product-service } }
                topologyKey: kubernetes.io/hostname
      containers:
        - name: product-service
          image: docker.io/YOUR_DOCKERHUB/demand-forecast-product-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: kubernetes
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://product-db-service.demand-forecast.svc.cluster.local:5432/productdb
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef: { name: demand-forecast-secrets, key: product-db-user }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef: { name: demand-forecast-secrets, key: product-db-password }
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka-service.demand-forecast.svc.cluster.local:9092
            - name: JAVA_OPTS
              value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://jaeger.demand-forecast-monitoring.svc.cluster.local:4317
            - name: OTEL_SERVICE_NAME
              value: product-service
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8081 }
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8081 }
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8081 }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: { cpu: "200m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
          lifecycle:
            preStop:
              exec: { command: ["sh", "-c", "sleep 15"] }
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: demand-forecast
  labels: { app: product-service }
spec:
  selector: { app: product-service }
  ports:
    - name: http
      port: 8081
      targetPort: 8081
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: product-service-hpa
  namespace: demand-forecast
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: product-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: product-service-pdb
  namespace: demand-forecast
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: product-service }

# ══════════════ ORDER SERVICE ════════════════════════════════════════════════
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: demand-forecast
  labels: { app: order-service, tier: backend }
spec:
  replicas: 3          # higher replica count — order processing is critical
  selector:
    matchLabels: { app: order-service }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: order-service, tier: backend }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8082"
    spec:
      terminationGracePeriodSeconds: 90   # longer — Kafka consumer needs time to commit offsets
      containers:
        - name: order-service
          image: docker.io/YOUR_DOCKERHUB/demand-forecast-order-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8082
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: kubernetes
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://order-db-service.demand-forecast.svc.cluster.local:5432/orderdb
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef: { name: demand-forecast-secrets, key: order-db-user }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef: { name: demand-forecast-secrets, key: order-db-password }
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka-service.demand-forecast.svc.cluster.local:9092
            # Tune Kafka consumer for exactly-once semantics in K8s
            - name: SPRING_KAFKA_CONSUMER_MAX_POLL_INTERVAL_MS
              value: "300000"
            - name: SPRING_KAFKA_CONSUMER_SESSION_TIMEOUT_MS
              value: "30000"
            - name: JAVA_OPTS
              value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError"
            - name: OTEL_SERVICE_NAME
              value: order-service
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://jaeger.demand-forecast-monitoring.svc.cluster.local:4317
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8082 }
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8082 }
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8082 }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1500m", memory: "1.5Gi" }
          lifecycle:
            preStop:
              exec: { command: ["sh", "-c", "sleep 20"] }
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: demand-forecast
spec:
  selector: { app: order-service }
  ports:
    - name: http
      port: 8082
      targetPort: 8082
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: order-service-hpa
  namespace: demand-forecast
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: order-service
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
    # Scale order-service on Kafka consumer lag (via KEDA or Prometheus Adapter)
    - type: External
      external:
        metric:
          name: kafka_consumer_group_lag
          selector:
            matchLabels:
              consumer_group: order-service-group
              topic: order.events
        target:
          type: AverageValue
          averageValue: "500"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 3
          periodSeconds: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: order-service-pdb
  namespace: demand-forecast
spec:
  minAvailable: 2   # always keep at least 2 pods for Kafka partition assignment
  selector:
    matchLabels: { app: order-service }

