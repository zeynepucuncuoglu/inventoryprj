apiVersion: v1
kind: Namespace
metadata:
  name: demand-forecast
  labels:
    app.kubernetes.io/managed-by: kubectl
    environment: production
    team: platform-engineering
---
apiVersion: v1
kind: Namespace
metadata:
  name: demand-forecast-monitoring
  labels:
    app.kubernetes.io/managed-by: kubectl
    purpose: observability
---
apiVersion: v1
kind: Namespace
metadata:
  name: demand-forecast-staging
  labels:
    app.kubernetes.io/managed-by: kubectl
    environment: staging
---
# LimitRange: prevent runaway containers from starving the node
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: demand-forecast
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "100m"
        memory: "256Mi"
      max:
        cpu: "4"
        memory: "4Gi"
---
# ResourceQuota: cap total namespace resource consumption
apiVersion: v1
kind: ResourceQuota
metadata:
  name: namespace-quota
  namespace: demand-forecast
spec:
  hard:
    requests.cpu: "8"
    requests.memory: "16Gi"
    limits.cpu: "16"
    limits.memory: "32Gi"
    pods: "50"
    persistentvolumeclaims: "20"
