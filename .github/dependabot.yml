version: 2

updates:
  # ── GitHub Actions ────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Istanbul
    labels: ["dependencies", "ci-cd"]
    commit-message:
      prefix: "ci(deps)"
    open-pull-requests-limit: 3
    groups:
      all-actions:
        patterns: ["*"]    # Tüm action güncellemeleri tek PR

  # ── Java — api-gateway ────────────────────────────────────────────────────
  - package-ecosystem: maven
    directory: "/demand-forecast-platform/services/api-gateway"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Istanbul
    labels: ["dependencies", "java", "api-gateway"]
    commit-message:
      prefix: "build(deps)"
    open-pull-requests-limit: 2
    groups:
      all-dependencies:
        patterns: ["*"]    # Tüm Maven bağımlılıkları tek PR

  # ── Java — product-service ────────────────────────────────────────────────
