name: CI/CD — Multi-Environment Pipeline

on:
  push:
    branches: [main, develop, "release/**"]
    paths:
      - "demand-forecast-platform/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "demand-forecast-platform/**"
      - ".github/workflows/**"

env:
  COMPOSE_DIR: demand-forecast-platform
  JAVA_VERSION: "21"
  PYTHON_VERSION: "3.12"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Default: minimal permissions — each job overrides what it needs
permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. SECURITY SCAN
  # ──────────────────────────────────────────────────────────────────────────
  security-scan:
    name: "Security / SAST"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # required for upload-sarif
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }

      - name: Trivy — filesystem scan (warn only, never blocks pipeline)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ./demand-forecast-platform
          format: sarif
          output: trivy-results.sarif
          severity: "HIGH,CRITICAL"
          exit-code: "0"
          timeout: "10m"          # Maven POM resolution can be slow
        continue-on-error: true   # scan crash (FATAL) also must not block pipeline

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4    # updated: v3 → v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true   # fork PRs can't write security-events, that's OK

      - name: OWASP Dependency Check — Java services
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/demand-forecast-platform:/src \
            -v ${{ github.workspace }}/dc-report:/report \
            owasp/dependency-check:latest \
            --project "demand-forecast" --scan /src \
            --format HTML --out /report \
            --failOnCVSS 8 || true
        continue-on-error: true

  # ──────────────────────────────────────────────────────────────────────────
  # 2. PARALLEL JAVA TESTS
  # ──────────────────────────────────────────────────────────────────────────
  test-java:
    name: "Test — ${{ matrix.service }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write     # required for test reporter to publish results
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, product-service, order-service, forecast-service, notification-service]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Run tests — ${{ matrix.service }}
        working-directory: ${{ env.COMPOSE_DIR }}/services/${{ matrix.service }}
        run: |
          mvn test -B --no-transfer-progress \
            -Dspring.datasource.url=jdbc:postgresql://localhost:5432/testdb \
            -Dspring.datasource.username=testuser \
            -Dspring.datasource.password=testpass

      # Replaced dorny/test-reporter@v1 (Node 20, permission issues)
      # with mikepenz/action-junit-report@v6 (Node 24, actively maintained)
      - name: Publish test report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: "${{ env.COMPOSE_DIR }}/services/${{ matrix.service }}/target/surefire-reports/*.xml"
          check_name: "JUnit — ${{ matrix.service }}"
          fail_on_failure: true
          require_tests: false    # don't fail if no XML found (e.g. api-gateway has no unit tests)
          include_passed: true

      - name: Upload JaCoCo coverage
        uses: codecov/codecov-action@v7    # updated: v4 → v5
        with:
          files: "${{ env.COMPOSE_DIR }}/services/${{ matrix.service }}/target/site/jacoco/jacoco.xml"
          flags: ${{ matrix.service }}
        continue-on-error: true   # codecov token missing in forks — don't block

  # ──────────────────────────────────────────────────────────────────────────
  # 3. PYTHON TESTS
  # ──────────────────────────────────────────────────────────────────────────
  test-python:
    name: "Test — ml-inference-service"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: "${{ env.COMPOSE_DIR }}/services/ml-inference-service/requirements.txt"

      - name: Install dependencies
        working-directory: ${{ env.COMPOSE_DIR }}/services/ml-inference-service
        run: pip install -r requirements.txt pytest-cov

      - name: Run tests with coverage
        working-directory: ${{ env.COMPOSE_DIR }}/services/ml-inference-service
        run: |
          pytest tests/ -v \
            --cov=app \
            --cov-report=xml \
            --cov-fail-under=80 \
            -p no:cacheprovider

      - name: Upload coverage
        uses: codecov/codecov-action@v7    # updated: v4 → v5
        with:
          files: "${{ env.COMPOSE_DIR }}/services/ml-inference-service/coverage.xml"
          flags: ml-inference-service
        continue-on-error: true

  # ──────────────────────────────────────────────────────────────────────────
  # 4. BUILD DOCKER IMAGES (push disabled — no registry configured)
  # ──────────────────────────────────────────────────────────────────────────
  build-images:
    name: "Build — ${{ matrix.service }}"
    runs-on: ubuntu-latest
    needs: [test-java, test-python, security-scan]
    if: github.event_name == 'push'
    permissions:
      contents: read
    strategy:
      matrix:
        service: [api-gateway, product-service, order-service, forecast-service, notification-service, ml-inference-service]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.COMPOSE_DIR }}/services/${{ matrix.service }}
          push: false
          tags: ${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

  # ──────────────────────────────────────────────────────────────────────────
  # 5. DEPLOY TO DEV
  # ──────────────────────────────────────────────────────────────────────────
  deploy-dev:
    name: "Deploy → dev"
    runs-on: ubuntu-latest
    needs: build-images
    if: github.ref == 'refs/heads/develop'
    continue-on-error: true   # no server configured yet — don't block pipeline
    permissions:
      contents: read
    environment:
      name: dev
      url: http://dev.demand-forecast.internal:8080
    steps:
      - uses: actions/checkout@v6

      - name: Deploy to dev server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd /opt/demand-forecast
            export IMAGE_TAG=sha-$(echo ${{ github.sha }} | cut -c1-7)
            export ENVIRONMENT=dev
            export COMPOSE_PROJECT_NAME=demand-forecast-dev
            git pull origin develop
            bash scripts/deployment.sh dev "$IMAGE_TAG"

      - name: Smoke tests against dev
        run: |
          sleep 30
          bash demand-forecast-platform/scripts/health-check.sh \
            --host "${{ secrets.DEV_SERVER_HOST }}" \
            --port 8080 \
            --environment dev

      - name: Notify Slack — dev deployed
        if: always()
        uses: slackapi/slack-github-action@v3
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_PLATFORM }}
          webhook-type: incoming-webhook
          payload: |
            {"text": "${{ job.status == 'success' && '✅' || '❌' }} *Dev deploy ${{ job.status }}*: `sha-${{ github.sha }}` by @${{ github.actor }}"}

  # ──────────────────────────────────────────────────────────────────────────
  # 6. DEPLOY TO STAGING
  # ──────────────────────────────────────────────────────────────────────────
  deploy-staging:
    name: "Deploy → staging"
    runs-on: ubuntu-latest
    needs: build-images
    if: github.ref == 'refs/heads/main'
    continue-on-error: true   # no server configured yet — don't block pipeline
    permissions:
      contents: read
    environment:
      name: staging
      url: http://staging.demand-forecast.internal:9080
    steps:
      - uses: actions/checkout@v6

      - name: Deploy to staging
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.STAGING_SERVER_HOST }}
          username: ${{ secrets.STAGING_SERVER_USER }}
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd /opt/demand-forecast
            export IMAGE_TAG=sha-$(echo ${{ github.sha }} | cut -c1-7)
            export ENVIRONMENT=staging
            export COMPOSE_PROJECT_NAME=demand-forecast-staging
            git pull origin main
            bash scripts/deployment.sh staging "$IMAGE_TAG"

      - name: Wait for staging to stabilise
        run: sleep 60

      - name: Run E2E tests against staging
        run: |
          export GATEWAY_URL=http://${{ secrets.STAGING_SERVER_HOST }}:9080
          export JWT_TEST_TOKEN=${{ secrets.STAGING_JWT_TEST_TOKEN }}
          bash demand-forecast-platform/test-e2e.sh

      - name: Run load test (k6)
        uses: grafana/k6-action@v0.3.1
        with:
          filename: demand-forecast-platform/tests/load/k6-smoke.js
          flags: --env GATEWAY_URL=http://${{ secrets.STAGING_SERVER_HOST }}:9080

      - name: Check SLO compliance post-deploy
        run: |
          ERROR_RATE=$(curl -sf "http://${{ secrets.STAGING_SERVER_HOST }}:9091/api/v1/query?query=sum(rate(http_server_requests_seconds_count{status=~'5..'}[5m]))/sum(rate(http_server_requests_seconds_count[5m]))*100" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); r=d['data']['result']; print(float(r[0]['value'][1]) if r else 0)")
          echo "Staging error rate: ${ERROR_RATE}%"
          if (( $(echo "$ERROR_RATE > 1.0" | bc -l) )); then
            echo "ERROR: Error rate ${ERROR_RATE}% exceeds 1% SLO threshold."
            exit 1
          fi

  # ──────────────────────────────────────────────────────────────────────────
  # 7. DEPLOY TO PRODUCTION (manual approval required)
  # ──────────────────────────────────────────────────────────────────────────
  deploy-production:
    name: "Deploy → production"
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    continue-on-error: true   # no server configured yet — don't block pipeline
    permissions:
      contents: read
      deployments: write
    environment:
      name: production
      url: https://api.demand-forecast.internal
    steps:
      - uses: actions/checkout@v6

      - name: Create deployment record
        uses: chrnorm/deployment-action@v2
        id: deployment
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: production
          description: "Deploying sha-${{ github.sha }} to production"

      - name: Deploy to production (blue-green)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd /opt/demand-forecast
            export IMAGE_TAG=sha-$(echo ${{ github.sha }} | cut -c1-7)
            export ENVIRONMENT=production
            export COMPOSE_PROJECT_NAME=demand-forecast-prod
            git pull origin main
            bash scripts/deployment.sh production "$IMAGE_TAG" --strategy=blue-green

      - name: Production health check
        run: |
          bash demand-forecast-platform/scripts/health-check.sh \
            --host "${{ secrets.PROD_SERVER_HOST }}" \
            --port 8080 \
            --environment production \
            --strict

      - name: Update deployment status — success
        if: success()
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          state: success
          environment-url: https://api.demand-forecast.internal

      - name: Update deployment status — failure
        if: failure()
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          state: failure

      - name: Auto-rollback on failure
        if: failure()
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: |
            echo "[ROLLBACK] Production deploy failed — initiating rollback"
            bash /opt/demand-forecast/scripts/rollback.sh production

      - name: Notify Slack — production result
        if: always()
        uses: slackapi/slack-github-action@v3
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_INCIDENTS }}
          webhook-type: incoming-webhook
          payload: |
            {"text": "${{ job.status == 'success' && '🚀' || '🔥' }} *Production deploy ${{ job.status }}*\n*SHA:* `sha-${{ github.sha }}`\n*Actor:* @${{ github.actor }}\n*Run:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}

  # ──────────────────────────────────────────────────────────────────────────
  # 8. CI GATE — required status check for branch protection
  # ──────────────────────────────────────────────────────────────────────────
  ci-gate:
    name: "CI Gate (required)"
    runs-on: ubuntu-latest
    needs: [test-java, test-python, security-scan, build-images]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Check all required jobs passed
        run: |
          echo "test-java    : ${{ needs.test-java.result }}"
          echo "test-python  : ${{ needs.test-python.result }}"
          echo "security-scan: ${{ needs.security-scan.result }}"

          if [[ "${{ needs.test-java.result }}" != "success" ]]; then
            echo "::error::Java tests FAILED or were skipped"
            exit 1
          fi
          if [[ "${{ needs.test-python.result }}" != "success" ]]; then
            echo "::error::Python tests FAILED or were skipped"
            exit 1
          fi
          echo "All required CI checks passed."
