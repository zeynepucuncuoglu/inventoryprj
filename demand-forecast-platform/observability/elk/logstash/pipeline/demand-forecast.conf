# Logstash pipeline: parse Spring Boot JSON logs + Python FastAPI logs
# Input: Filebeat on port 5044, direct TCP JSON on port 5000
# Output: Elasticsearch index pattern demand-forecast-{service}-{YYYY.MM.dd}

input {
  beats {
    port => 5044
    type => "filebeat"
  }
  tcp {
    port => 5000
    codec => json_lines
    type => "direct"
  }
}

filter {
  # ── Determine service name from Docker container label ──────────────
  if [container][name] {
    mutate {
      add_field => { "service_name" => "%{[container][name]}" }
    }
    mutate {
      gsub => [ "service_name", "^/", "" ]
    }
  }

  # ── Parse Spring Boot JSON log format (Logback + logstash-logback-encoder) ──
  if [service_name] =~ /^(api-gateway|product-service|order-service|forecast-service|notification-service)/ {
    json {
      source => "message"
      target => "parsed"
      skip_on_invalid_json => true
    }

    if [parsed][level] {
      mutate {
        rename => {
          "[parsed][level]"           => "log_level"
          "[parsed][logger_name]"     => "logger"
          "[parsed][message]"         => "log_message"
          "[parsed][thread_name]"     => "thread"
          "[parsed][stack_trace]"     => "stack_trace"
          "[parsed][traceId]"         => "trace_id"
          "[parsed][spanId]"          => "span_id"
          "[parsed][@timestamp]"      => "app_timestamp"
        }
      }
      mutate { remove_field => ["parsed", "message"] }

      # Tag exceptions for alerting
      if [stack_trace] {
        mutate { add_tag => ["exception"] }
      }

      # Tag circuit breaker events
      if [log_message] =~ /CircuitBreaker|OPEN|HALF_OPEN/ {
        mutate { add_tag => ["circuit_breaker_event"] }
      }

      # Tag Kafka consumer lag warnings
      if [log_message] =~ /consumer lag|ConsumerLag|lag=/ {
        mutate { add_tag => ["kafka_lag"] }
        grok {
          match => { "log_message" => "lag=(?<kafka_lag_value>\d+)" }
        }
        if [kafka_lag_value] {
          mutate { convert => { "kafka_lag_value" => "integer" } }
        }
      }

      # Tag slow query warnings from HikariCP
      if [log_message] =~ /Slow query|connection timeout|HikariPool/ {
        mutate { add_tag => ["db_performance"] }
      }
    }
  }

  # ── Parse Python FastAPI / uvicorn logs ──────────────────────────────
  if [service_name] == "ml-inference-service" {
    grok {
      match => {
        "message" => [
          # uvicorn access log
          '%{IPORHOST:client_ip} - "%{WORD:http_method} %{URIPATH:request_path}(?:%{URIPARAM:request_params})? HTTP/%{NUMBER:http_version}" %{NUMBER:status_code:int} %{NUMBER:response_bytes:int}',
          # uvicorn error / info log
          "%{LOGLEVEL:log_level}:%{NOTSPACE:logger}:%{GREEDYDATA:log_message}"
        ]
      }
      tag_on_failure => ["_grokparsefailure_python"]
    }
    if [status_code] >= 500 {
      mutate { add_tag => ["python_error"] }
    }
  }

  # ── Extract HTTP latency from Spring actuator log lines ──────────────
  grok {
    match => {
      "log_message" => "(?:GET|POST|PUT|DELETE|PATCH) %{URIPATH} took %{NUMBER:http_latency_ms:float}ms"
    }
    tag_on_failure => []
  }

  # ── Normalize log level for cross-service dashboards ─────────────────
  if [log_level] {
    mutate {
      uppercase => [ "log_level" ]
    }
    if [log_level] in ["ERROR", "FATAL", "CRITICAL"] {
      mutate { add_field => { "severity" => "high" } }
    } else if [log_level] == "WARN" {
      mutate { add_field => { "severity" => "medium" } }
    } else {
      mutate { add_field => { "severity" => "low" } }
    }
  }

  # ── Add environment label ─────────────────────────────────────────────
  mutate {
    add_field => {
      "environment" => "${ENVIRONMENT:development}"
      "platform"    => "demand-forecast"
    }
  }

  # ── Drop noisy health check logs ────────────────────────────────────
  if [request_path] == "/actuator/health" or [request_path] == "/health" {
    drop {}
  }
}

output {
  # Write to per-service daily indices
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "demand-forecast-%{service_name}-%{+YYYY.MM.dd}"
    template_name => "demand-forecast"
    template_overwrite => true
  }

  # Also write exceptions to a dedicated alert index for Kibana watchers
  if "exception" in [tags] or "circuit_breaker_event" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "demand-forecast-alerts-%{+YYYY.MM.dd}"
    }
  }

  # Debug stdout (disable in production)
  if "${LOGSTASH_DEBUG:false}" == "true" {
    stdout {
      codec => rubydebug
    }
  }
}
