# Staging environment override — farklı portlar, production ile çakışmaz
# Kullanım: docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d --build
#
# Staging portları:
#   api-gateway          → 9080  (production: 8080)
#   product-service      → 9081  (production: 8081)
#   order-service        → 9082  (production: 8082)
#   forecast-service     → 9083  (production: 8083)
#   notification-service → 9084  (production: 8084)
#   ml-inference-service → 9000  (production: 8000)
#   prometheus           → 9091  (production: 9090)
#   grafana              → 3001  (production: 3000)

services:

  api-gateway:
    ports:
      - "9080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: staging

  product-service:
    ports:
      - "9081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: staging

  order-service:
    ports:
      - "9082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: staging

  forecast-service:
    ports:
      - "9083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: staging

  notification-service:
    ports:
      - "9084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: staging

  ml-inference-service:
    ports:
      - "9000:8000"

  prometheus:
    ports:
      - "9091:9090"

  grafana:
    ports:
      - "3001:3000"
