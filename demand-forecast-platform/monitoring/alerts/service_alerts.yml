groups:

  - name: service_availability
    interval: 60s
    rules:

      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is DOWN"
          description: "{{ $labels.job }} ({{ $labels.instance }}) has been unreachable for >1 min."

      - alert: UptimeBelowSLA
        expr: |
          (
            sum_over_time(up[24h]) / count_over_time(up[24h])
          ) < 0.99
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} uptime below 99% SLA"
          description: "24-hour uptime is {{ $value | humanizePercentage }}."

  - name: http_traffic
    interval: 60s
    rules:

      - alert: HighErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) by (job)
          /
          sum(rate(http_server_requests_seconds_count[5m])) by (job)
          > 0.01
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High error rate on {{ $labels.job }}"
          description: "Error rate is {{ $value | humanizePercentage }} (threshold 1%)."

      - alert: HighP95Latency
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_server_requests_seconds_bucket[5m])) by (job, le)
          ) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency on {{ $labels.job }}"
          description: "p95 latency is {{ $value | humanizeDuration }} (threshold 500 ms)."

      - alert: HighP99Latency
        expr: |
          histogram_quantile(0.99,
            sum(rate(http_server_requests_seconds_bucket[5m])) by (job, le)
          ) > 1.0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Critical p99 latency on {{ $labels.job }}"
          description: "p99 latency is {{ $value | humanizeDuration }} (threshold 1 s)."

  - name: kafka_health
    interval: 60s
    rules:

      - alert: KafkaConsumerLagHigh
        expr: |
          sum(kafka_consumer_fetch_manager_records_lag) by (client_id) > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Kafka consumer lag high for {{ $labels.client_id }}"
          description: "Consumer lag is {{ $value }} records."

  - name: jvm_health
    interval: 60s
    rules:

      - alert: JvmHeapUsageHigh
        expr: |
          (
            jvm_memory_used_bytes{area="heap"}
            /
            jvm_memory_max_bytes{area="heap"}
          ) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High JVM heap on {{ $labels.job }}"
          description: "Heap usage is {{ $value | humanizePercentage }} (threshold 85%)."

      - alert: JvmGcPauseHigh
        expr: |
          rate(jvm_gc_pause_seconds_sum[5m])
          /
          rate(jvm_gc_pause_seconds_count[5m])
          > 0.3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow GC on {{ $labels.job }}"
          description: "Average GC pause is {{ $value | humanizeDuration }}."
