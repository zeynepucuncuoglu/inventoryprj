name: CI/CD — Multi-Environment Pipeline

on:
  push:
    branches: [main, develop, "release/**"]
    paths: ["demand-forecast-platform/**"]
  pull_request:
    branches: [main, develop]
    paths: ["demand-forecast-platform/**"]

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: ${{ secrets.DOCKER_HUB_USERNAME }}/demand-forecast
  COMPOSE_DIR: demand-forecast-platform
  JAVA_VERSION: "21"
  PYTHON_VERSION: "3.12"

# Cancel in-progress runs on the same branch (except main)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. STATIC ANALYSIS + SECURITY SCAN
  # ──────────────────────────────────────────────────────────────────────────
  security-scan:
    name: "Security / SAST"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Trivy — scan repo for secrets and vuln dependencies
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ./demand-forecast-platform
          format: sarif
          output: trivy-results.sarif
          severity: "HIGH,CRITICAL"
          exit-code: "1"
        continue-on-error: true  # warn, don't block; promote to block on main

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: OWASP Dependency Check — Java services
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/demand-forecast-platform:/src \
            -v ${{ github.workspace }}/dc-report:/report \
            owasp/dependency-check:latest \
            --project "demand-forecast" --scan /src \
            --format HTML --out /report \
            --failOnCVSS 8 || true
        continue-on-error: true

  # ──────────────────────────────────────────────────────────────────────────
  # 2. PARALLEL TESTING
  # ──────────────────────────────────────────────────────────────────────────
  test-java:
    name: "Test — ${{ matrix.service }}"
    runs-on: ubuntu-latest
    needs: []
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, product-service, order-service, forecast-service, notification-service]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Run tests — ${{ matrix.service }}
        working-directory: ${{ env.COMPOSE_DIR }}/services/${{ matrix.service }}
        run: |
          mvn test -B --no-transfer-progress \
            -Dspring.datasource.url=jdbc:postgresql://localhost:5432/testdb \
            -Dspring.datasource.username=testuser \
            -Dspring.datasource.password=testpass

      - name: Publish test report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: "JUnit — ${{ matrix.service }}"
          path: "${{ env.COMPOSE_DIR }}/services/${{ matrix.service }}/target/surefire-reports/*.xml"
          reporter: java-junit

      - name: Upload JaCoCo coverage
        uses: codecov/codecov-action@v4
        with:
          files: "${{ env.COMPOSE_DIR }}/services/${{ matrix.service }}/target/site/jacoco/jacoco.xml"
          flags: ${{ matrix.service }}

  test-python:
    name: "Test — ml-inference-service"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: "${{ env.COMPOSE_DIR }}/services/ml-inference-service/requirements.txt"

      - name: Install dependencies
        working-directory: ${{ env.COMPOSE_DIR }}/services/ml-inference-service
        run: pip install -r requirements.txt pytest-cov

      - name: Run tests with coverage
        working-directory: ${{ env.COMPOSE_DIR }}/services/ml-inference-service
        run: |
          pytest tests/ -v \
            --cov=app \
            --cov-report=xml \
            --cov-fail-under=80 \
            -p no:cacheprovider

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: "${{ env.COMPOSE_DIR }}/services/ml-inference-service/coverage.xml"
          flags: ml-inference-service

  # ──────────────────────────────────────────────────────────────────────────
  # 3. BUILD & PUSH DOCKER IMAGES
  # ──────────────────────────────────────────────────────────────────────────
  build-images:
    name: "Build & Push — ${{ matrix.service }}"
    runs-on: ubuntu-latest
    needs: [test-java, test-python, security-scan]
    if: github.event_name == 'push'
    strategy:
      matrix:
        service: [api-gateway, product-service, order-service, forecast-service, notification-service, ml-inference-service]
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.COMPOSE_DIR }}/services/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Pass git SHA as build arg for runtime version endpoint
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

      - name: Trivy scan image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:sha-${{ github.sha }}
          format: table
          severity: "CRITICAL"
          exit-code: "1"

  # ──────────────────────────────────────────────────────────────────────────
  # 4. DEPLOY TO DEV (automatic on every push to develop)
  # ──────────────────────────────────────────────────────────────────────────
  deploy-dev:
    name: "Deploy → dev"
    runs-on: ubuntu-latest
    needs: build-images
    if: github.ref == 'refs/heads/develop'
    environment:
      name: dev
      url: http://dev.demand-forecast.internal:8080
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to dev server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd /opt/demand-forecast
            export IMAGE_TAG=sha-$(echo ${{ github.sha }} | cut -c1-7)
            export ENVIRONMENT=dev
            export COMPOSE_PROJECT_NAME=demand-forecast-dev
            git pull origin develop
            bash scripts/deployment.sh dev "$IMAGE_TAG"

      - name: Run smoke tests against dev
        run: |
          sleep 30  # let services stabilize
          bash demand-forecast-platform/scripts/health-check.sh \
            --host "${{ secrets.DEV_SERVER_HOST }}" \
            --port 8080 \
            --environment dev

      - name: Notify Slack — dev deployed
        if: always()
        uses: slackapi/slack-github-action@v1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_PLATFORM }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "${{ job.status == 'success' && '✅' || '❌' }} *Dev deploy ${{ job.status }}*: `sha-${{ github.sha }}` by @${{ github.actor }}"
            }

  # ──────────────────────────────────────────────────────────────────────────
  # 5. DEPLOY TO STAGING (automatic on main, runs integration tests)
  # ──────────────────────────────────────────────────────────────────────────
  deploy-staging:
    name: "Deploy → staging"
    runs-on: ubuntu-latest
    needs: build-images
    if: github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: http://staging.demand-forecast.internal:9080
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_SERVER_HOST }}
          username: ${{ secrets.STAGING_SERVER_USER }}
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd /opt/demand-forecast
            export IMAGE_TAG=sha-$(echo ${{ github.sha }} | cut -c1-7)
            export ENVIRONMENT=staging
            export COMPOSE_PROJECT_NAME=demand-forecast-staging
            git pull origin main
            bash scripts/deployment.sh staging "$IMAGE_TAG"

      - name: Wait for staging to stabilise
        run: sleep 60

      - name: Run E2E tests against staging
        run: |
          export GATEWAY_URL=http://${{ secrets.STAGING_SERVER_HOST }}:9080
          export JWT_TEST_TOKEN=${{ secrets.STAGING_JWT_TEST_TOKEN }}
          bash demand-forecast-platform/test-e2e.sh

      - name: Run load test (k6)
        uses: grafana/k6-action@v0.3.1
        with:
          filename: demand-forecast-platform/tests/load/k6-smoke.js
          flags: --env GATEWAY_URL=http://${{ secrets.STAGING_SERVER_HOST }}:9080

      - name: Check SLO compliance post-deploy
        run: |
          # Query Prometheus for error rate and latency over last 5 minutes
          ERROR_RATE=$(curl -sf "http://${{ secrets.STAGING_SERVER_HOST }}:9091/api/v1/query?query=sum(rate(http_server_requests_seconds_count{status=~'5..'}[5m]))/sum(rate(http_server_requests_seconds_count[5m]))*100" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); r=d['data']['result']; print(float(r[0]['value'][1]) if r else 0)")
          echo "Staging error rate: ${ERROR_RATE}%"
          if (( $(echo "$ERROR_RATE > 1.0" | bc -l) )); then
            echo "ERROR: Error rate ${ERROR_RATE}% exceeds 1% SLO threshold. Blocking production promotion."
            exit 1
          fi

  # ──────────────────────────────────────────────────────────────────────────
  # 6. DEPLOY TO PRODUCTION (manual approval required)
  # ──────────────────────────────────────────────────────────────────────────
  deploy-production:
    name: "Deploy → production"
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://api.demand-forecast.internal
    steps:
      - uses: actions/checkout@v4

      - name: Create deployment record
        uses: chrnorm/deployment-action@v2
        id: deployment
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: production
          description: "Deploying sha-${{ github.sha }} to production"

      - name: Deploy to production (blue-green)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd /opt/demand-forecast
            export IMAGE_TAG=sha-$(echo ${{ github.sha }} | cut -c1-7)
            export ENVIRONMENT=production
            export COMPOSE_PROJECT_NAME=demand-forecast-prod
            git pull origin main
            # Blue-green: bring up new containers before stopping old
            bash scripts/deployment.sh production "$IMAGE_TAG" --strategy=blue-green

      - name: Production health check
        run: |
          bash demand-forecast-platform/scripts/health-check.sh \
            --host "${{ secrets.PROD_SERVER_HOST }}" \
            --port 8080 \
            --environment production \
            --strict

      - name: Update deployment status — success
        if: success()
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          state: success
          environment-url: https://api.demand-forecast.internal

      - name: Update deployment status — failure + auto-rollback
        if: failure()
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          state: failure

      - name: Auto-rollback on failure
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: |
            echo "[ROLLBACK] Production deploy failed — initiating rollback"
            bash /opt/demand-forecast/scripts/rollback.sh production

      - name: Notify Slack — production result
        if: always()
        uses: slackapi/slack-github-action@v1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_INCIDENTS }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "${{ job.status == 'success' && '🚀' || '🔥' }} *Production deploy ${{ job.status }}*\n*SHA:* `sha-${{ github.sha }}`\n*Actor:* @${{ github.actor }}\n*Workflow:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }

  # ──────────────────────────────────────────────────────────────────────────
  # 7. GATE — all tests + security must pass before any merge to main
  # ──────────────────────────────────────────────────────────────────────────
  ci-gate:
    name: "CI Gate (required)"
    runs-on: ubuntu-latest
    needs: [test-java, test-python, security-scan]
    if: always()
    steps:
      - name: Check all required jobs passed
        run: |
          if [[ "${{ needs.test-java.result }}" != "success" ]]; then
            echo "Java tests FAILED"; exit 1
          fi
          if [[ "${{ needs.test-python.result }}" != "success" ]]; then
            echo "Python tests FAILED"; exit 1
          fi
          echo "All CI checks passed."
